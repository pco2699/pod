[package]
name = "pod-client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36.2"
hex = "0.4.3"
js-sys = "0.3.106"
log = "0.4.34"
pod-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Location", "History", "Storage", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Request", "RequestInit", "Headers", "Response", "ResponseInit", "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "CacheStorage", "Cache", "ReadableStream", "ReadableStreamDefaultReader", "Event", "EventTarget", "UrlSearchParams", "Url", "console", "BeforeUnloadEvent", "AudioContextState"] }
