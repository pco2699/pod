[package]
name = "pod-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
mime_guess = "2.0.5"
pod-core = { version = "0.1.0", path = "../core" }
rand = "0.10.3"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
